name: Deploy Agritrack Locally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker version

      - name: Build Agritrack image
        run: docker build -t agritrack:latest .

      - name: Remove previous container
        run: docker rm -f agritrack-container
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name agritrack-container --restart unless-stopped -p 8101:8101 agritrack:latest

      - name: Verify app
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8101/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $success) {
            docker logs agritrack-container
            exit 1
          }